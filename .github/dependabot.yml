# Bump mechanism for the QA agent's PINNED dependencies.
#
# WHY THIS FILE EXISTS. agents/qa/agent/requirements.txt uses `==`, not `>=`
# (P2.4), because a floor silently drifted a minor version into production. A
# pin buys reproducibility and costs exactly one thing: nothing updates itself
# any more, including a security patch. That trade is only acceptable if
# something else does the noticing -- otherwise "frozen" quietly becomes
# "abandoned". This is that something.
#
# TWO PYTHON DIRS ARE LISTED, and the rule is the same for both: Dependabot's
# value here is raising an exact pin. agents/qa/agent has used `==` since P2.4.
# agents/qa/harness joined it in P0.6 -- it declared nothing at all until then,
# which is how it came to resolve a urllib3 line carrying five open advisories
# while the agent lock beside it audited clean.
#
# The other two stay out for the reason this note has always given.
# agents/fix/requirements.txt declares `boto3>=1.34.0`, a floor that already
# admits every new release, so there is nothing for a bump PR to change;
# agents/converge/requirements.txt is a comment-only declaration (the
# convergence session is pure stdlib). Add them here if either ever gains a pin.
#
# A MERGED BUMP CHANGES NOTHING THAT RUNS. This repo deploys an artifact, not a
# source tree: the AgentCore runtime executes the zip whose S3 version id is
# pinned in infra/layer1_persistent/dev.tfvars. A Dependabot PR edits
# requirements.txt only, so merging it puts the repo AHEAD of the deployed zip
# until someone runs the CLAUDE.md rule 5 sequence (package -> commit both code
# vars -> apply-dev.sh). Treat a merged bump as scheduled work, not as shipped.
version: 2
updates:
  - package-ecosystem: pip
    directory: /agents/qa/agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  # The harness half. Unlike the agent block above, a merged bump here DOES
  # change what runs -- the harness executes from the checkout on the GitHub
  # runner, not from a deployed zip -- so treat one as shippable rather than as
  # scheduled work. (Production still installs from vesselAI's own workflow;
  # see the scope note in the requirements file.)
  #
  # GROUPED, because boto3 and botocore CANNOT MOVE SEPARATELY. boto3 1.43.89
  # declares `botocore>=1.43.89`, so the two pins are not independent lines in a
  # file -- they are one fact written twice. Ungrouped, Dependabot opened one PR
  # each (#93, #94), both editing the same line, where ONE merge order works and
  # the other produces a tree that cannot install:
  #
  #   botocore first -> boto3 1.43.87 wants >=1.43.87, gets 1.43.89.  fine
  #   boto3 first    -> boto3 1.43.89 wants >=1.43.89, file says 1.43.87.  broken
  #
  # A recurring choice where one option is silently wrong is the shape this file
  # already argues against for npm: "a queue of unmergeable PRs teaches people to
  # ignore the queue." One PR carrying both removes the choice.
  #
  # Scoped to the aws-sdk pair rather than a catch-all group: anything else that
  # lands here genuinely can move on its own, and grouping independent packages
  # only means one bad member blocks the rest.
  - package-ecosystem: pip
    directory: /agents/qa/harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"

  # The workflows themselves. Every `uses:` in ci.yml sits on a major tag, and
  # nothing was watching them -- the same "a pin buys reproducibility and costs
  # you security patches" trade as the pip block above, one layer down. Unlike
  # that block, a merged bump here DOES change what runs: CI executes the
  # workflow from the repo, not from a deployed artifact.
  #
  # npm is still deliberately absent. app/'s production tree is clean; what
  # remains is the vitest -> vite -> esbuild dev chain, whose fix needs Node
  # >=22.12 against an app pinned to Node 20 in the runner and in both stages of
  # app/Dockerfile. Dependabot would open bump PRs that cannot merge until that
  # decision is made, and a queue of unmergeable PRs teaches people to ignore
  # the queue. Add it once the Node version moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
