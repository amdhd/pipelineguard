name: CI

# Fast pre-flight checks on every PR and push to main. This is the shift-left
# mirror of the in-AWS pipeline: it validates and tests a change *before* merge,
# so the expensive CodePipeline run only ever sees green code.
#
# Nothing here touches AWS — no credentials, no backend, no apply. Terraform is
# validated with `-backend=false`; the gate unit tests stub boto3/anthropic.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (fmt · validate · tflint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: terraform fmt
        # infra/ holds two roots (layer1_persistent + layer2_ephemeral) plus the
        # shared modules/; fmt walks the whole tree from the infra dir.
        run: terraform fmt -check -recursive infra

      - name: terraform init + validate (each layer root)
        run: |
          for dir in infra/layer1_persistent infra/layer2_ephemeral; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        # Report all findings, but only FAIL the job on errors — style warnings
        # (per-module version constraints, unused declarations) are advisory.
        # --recursive from infra/ covers both layer roots and the shared modules.
        run: |
          tflint --init
          tflint --chdir=infra --recursive --format compact --minimum-failure-severity=error

  checkov:
    name: Checkov (IaC static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors the pipeline's security gate: HIGH/CRITICAL misconfigurations
      # fail the check. The repo is hardened to 0 findings (see #4), so this
      # stays green until a change reintroduces one — which is the whole point.
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          quiet: true
          soft_fail: false
          output_format: cli

  python-gates:
    name: Gate handlers (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The gate tests stub boto3, the anthropic SDK, and shell out to
      # checkov/trivy. The QA agent tests additionally import agents/qa/agent/cdp.py,
      # which needs websocket-client at import time -- the agent's other deps
      # (bedrock-agentcore, and pydantic beneath it) are deliberately NOT
      # installed here, because the tests that would need them exercise the
      # browser and are covered against a fake instead.
      - name: Install test deps
        run: pip install boto3 pytest websocket-client

      - name: pytest
        run: pytest -q

      # SCA on the agent's runtime closure -- the one scan no existing gate
      # covers (npm audit covers the app; checkov/trivy cover infra). Audits the
      # hash-locked requirements.lock, so versions are fixed and the result is
      # stable instead of whatever PyPI resolves that day. A real gate: the
      # current closure audits clean (P2.5, 2026-09-04), so a newly introduced
      # HIGH/CRITICAL prod dependency blocks the PR rather than being swept
      # under `|| true` -- a step that always goes green tells nobody anything.
      - name: pip-audit (agent runtime closure)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r agents/qa/agent/requirements.lock

  node-app:
    name: App (build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --prefix app

      - name: Type-check + build
        run: npm run build --prefix app

      - name: Test
        run: npm test --prefix app

      # SCA on the app's dependency tree — the one scan the pipeline's image +
      # IaC gates don't cover. A real gate at high+: the current tree passes
      # (its only finding is a LOW body-parser awaiting `npm audit fix`), so a
      # new HIGH/CRITICAL prod dependency blocks the PR instead of being swept
      # under `|| true` — a step that always goes green tells nobody anything.
      - name: npm audit (high+)
        run: npm audit --omit=dev --audit-level=high --prefix app

  workflow-script-lint:
    name: Workflows + scripts (actionlint · shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actionlint over the workflow YAML, so a malformed `on:` or step breaks
      # the PR, not a live dispatch. Downloaded pinned -- a linter release is
      # not a reason to turn CI red. linux_x86_64 for the ubuntu-latest runner.
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

      # shellcheck over the scripts at warning+ -- style is advisory, the same
      # split as tflint's --minimum-failure-severity=error. Every script is
      # currently clean at this severity, so a newly introduced warning blocks
      # the PR instead of drifting in. Downloaded pinned, same reason.
      - name: shellcheck
        run: |
          curl -sSfL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar xJf shellcheck.tar.xz
          shellcheck-v0.11.0/shellcheck -S warning scripts/*.sh
