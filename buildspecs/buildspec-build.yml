version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-1
  parameter-store:
    ECR_REPO_URL: /pipelineguard/ecr_repo_url

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URL
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Image tag $IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker image..."
      - cd app
      - docker build -t $ECR_REPO_URL:$IMAGE_TAG .
      - docker tag $ECR_REPO_URL:$IMAGE_TAG $ECR_REPO_URL:latest
      - cd ..

  post_build:
    commands:
      - echo "Pushing to ECR..."
      - docker push $ECR_REPO_URL:$IMAGE_TAG
      - docker push $ECR_REPO_URL:latest
      - printf '[{"name":"app","imageUri":"%s"}]' "$ECR_REPO_URL:$IMAGE_TAG" > imagedefinitions.json
      - echo "$IMAGE_TAG" > image_tag.txt
      - echo "Build complete. Image $ECR_REPO_URL:$IMAGE_TAG"

artifacts:
  files:
    - imagedefinitions.json
    - image_tag.txt
    - terraform/**/*
    - gates/**/*
    - buildspecs/**/*
