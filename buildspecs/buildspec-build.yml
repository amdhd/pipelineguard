version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-southeast-1
  parameter-store:
    ECR_REPO_URL: /pipelineguard/ecr_repo_url

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URL
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Image tag $IMAGE_TAG"

  build:
    commands:
      - echo "Building Docker image..."
      - cd app
      - docker build -t $ECR_REPO_URL:$IMAGE_TAG .
      - cd ..

  post_build:
    commands:
      # Push only the immutable, SHA-tagged image. The repo is IMMUTABLE, so a
      # second ':latest' push would be rejected; the deploy uses the SHA tag via
      # imagedefinitions.json anyway, so ':latest' is unnecessary.
      - echo "Pushing to ECR..."
      - docker push $ECR_REPO_URL:$IMAGE_TAG
      - printf '[{"name":"app","imageUri":"%s"}]' "$ECR_REPO_URL:$IMAGE_TAG" > imagedefinitions.json
      - echo "$IMAGE_TAG" > image_tag.txt
      # Record the full commit SHA so the security gate can map it back to its PR
      # (CODEBUILD_RESOLVED_SOURCE_VERSION is empty in the gate stage — its input
      # is this build_output artifact, not the Git source).
      - echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" > commit_sha.txt
      - echo "Build complete. Image $ECR_REPO_URL:$IMAGE_TAG"

artifacts:
  files:
    - imagedefinitions.json
    - image_tag.txt
    - commit_sha.txt
    - infra/**/*
    - gates/**/*
    - buildspecs/**/*
