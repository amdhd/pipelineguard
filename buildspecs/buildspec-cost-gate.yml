version: 0.2

# Invokes the cost gate Lambda with the terraform plan JSON as its input
# artifact. The Lambda reads the plan from S3 (the CodePipeline artifact
# location) and signals pass/fail via the CodePipeline job API. Here we invoke
# it directly and inspect the returned gate_status for the CodeBuild-driven flow.

phases:
  build:
    commands:
      - echo "Uploading plan.json for the cost gate..."
      - PLAN_KEY="cost-gate/${CODEBUILD_RESOLVED_SOURCE_VERSION}/plan.json"
      - aws s3 cp terraform/plan.json "s3://${ARTIFACT_BUCKET:-$CODEBUILD_SOURCE_REPO_URL}/$PLAN_KEY" || true
      - echo "Invoking cost gate Lambda ${COST_GATE_FUNCTION}..."
      - |
        aws lambda invoke \
          --function-name "$COST_GATE_FUNCTION" \
          --cli-binary-format raw-in-base64-out \
          --payload "$(printf '{"plan_s3_key":"%s"}' "$PLAN_KEY" | base64)" \
          /tmp/cost_response.json
      - cat /tmp/cost_response.json
      - |
        STATUS=$(python3 -c "import sys,json; d=json.load(open('/tmp/cost_response.json')); print(d.get('gate_status','failed'))" 2>/dev/null || echo failed)
        if [ "$STATUS" != "passed" ]; then
          echo "Cost gate FAILED (status=$STATUS)"
          exit 1
        fi
        echo "Cost gate PASSED"
