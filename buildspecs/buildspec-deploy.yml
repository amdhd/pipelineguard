version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /tmp/tfbin
      - mv /tmp/tfbin/terraform /usr/local/bin/
      - terraform version

  build:
    commands:
      - echo "Applying Terraform..."
      - cd infra
      # backend.conf is git-ignored, so regenerate it in CI.
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - |
        cat > backend.conf <<EOF
        bucket         = "pipelineguard-tfstate-${ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
        key            = "pipelineguard/${ENVIRONMENT}/terraform.tfstate"
        region         = "${AWS_DEFAULT_REGION}"
        encrypt        = true
        EOF
      # No secrets are passed to Terraform: `terraform show -json` writes sensitive
      # values into plan.json in plaintext, and that file ships as an artifact.
      # The gate API keys live only in Secrets Manager, read by the Lambdas at runtime.
      # Deploy the exact image this pipeline run built (the immutable Git-SHA tag),
      # not a floating ':latest'. Applying the new tag updates the task definition,
      # which rolls the ECS service automatically — no separate force-new-deployment.
      - IMAGE_TAG=$(cat ../image_tag.txt 2>/dev/null || cat image_tag.txt 2>/dev/null || echo latest)
      - echo "Deploying image tag $IMAGE_TAG"
      - terraform init -backend-config=backend.conf -reconfigure
      # Deploy = roll the ECS service to the new image, nothing else. Target only
      # the ECS task def + service so the apply never touches the gate Lambdas,
      # secret, or SSM (whose diffs would need extra perms and cause churn).
      # -refresh=false keeps the deploy role least-privilege.
      - |
        terraform apply -auto-approve -refresh=false \
          -var-file=environments/${ENVIRONMENT}.tfvars \
          -var="app_image_tag=${IMAGE_TAG}" \
          -target=module.ecs.aws_ecs_task_definition.app \
          -target=module.ecs.aws_ecs_service.app
      - cd ..

  post_build:
    commands:
      - echo "Waiting for service to stabilise (circuit breaker will roll back on failure)..."
      - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
      - echo "Deploy complete."
