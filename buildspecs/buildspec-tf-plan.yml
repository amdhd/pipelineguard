version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /tmp/tfbin
      - mv /tmp/tfbin/terraform /usr/local/bin/
      - terraform version

  build:
    commands:
      - cd infra
      # backend.conf is git-ignored, so regenerate it in CI.
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - |
        cat > backend.conf <<EOF
        bucket         = "pipelineguard-tfstate-${ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
        key            = "pipelineguard/${ENVIRONMENT}/terraform.tfstate"
        region         = "${AWS_DEFAULT_REGION}"
        encrypt        = true
        EOF
      # No secrets are passed to Terraform: `terraform show -json` writes sensitive
      # values into plan.json in plaintext, and that file ships as an artifact.
      # The gate API keys live only in Secrets Manager, read by the Lambdas at runtime.
      - terraform init -backend-config=backend.conf -reconfigure
      - terraform validate
      # -refresh=false keeps the plan role least-privilege (no describe on every
      # resource); the config-vs-state delta is all the cost gate needs.
      - terraform plan -var-file=environments/${ENVIRONMENT}.tfvars -refresh=false -out=plan.tfplan -no-color
      - terraform show -json plan.tfplan > plan.json
      - echo "Plan complete"

artifacts:
  files:
    - infra/plan.json
    - infra/plan.tfplan
    - infra/**/*
    - gates/**/*
    - buildspecs/**/*
    - imagedefinitions.json
    - image_tag.txt
