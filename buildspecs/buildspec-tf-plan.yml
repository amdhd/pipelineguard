version: 0.2

phases:
  install:
    commands:
      - echo "Installing Terraform..."
      # Unzip to /tmp — the archive contains a file named 'terraform', which would
      # collide with the repo's ./terraform directory if extracted in place.
      - curl -fsSL https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /tmp/tfbin
      - mv /tmp/tfbin/terraform /usr/local/bin/
      - terraform version

  build:
    commands:
      - cd terraform
      # backend.conf and *.auto.tfvars are git-ignored, so regenerate them in CI.
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - |
        cat > backend.conf <<EOF
        bucket         = "pipelineguard-tfstate-${ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
        key            = "pipelineguard/${ENVIRONMENT}/terraform.tfstate"
        region         = "${AWS_DEFAULT_REGION}"
        dynamodb_table = "pipelineguard-tflock-${ENVIRONMENT}"
        encrypt        = true
        EOF
      # Pull the gate secrets into TF_VAR_* so the required sensitive vars resolve.
      - SECRET_JSON=$(aws secretsmanager get-secret-value --secret-id "pipelineguard/gates/${ENVIRONMENT}" --query SecretString --output text)
      - export TF_VAR_infracost_api_key=$(printf '%s' "$SECRET_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['INFRACOST_API_KEY'])")
      - export TF_VAR_anthropic_api_key=$(printf '%s' "$SECRET_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['ANTHROPIC_API_KEY'])")
      - export TF_VAR_slack_webhook_url=$(printf '%s' "$SECRET_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin)['SLACK_WEBHOOK_URL'])")
      # Keep the plan consistent with the token already stored in the secret.
      - export TF_VAR_github_token=$(printf '%s' "$SECRET_JSON" | python3 -c "import sys,json;print(json.load(sys.stdin).get('GITHUB_TOKEN',''))")
      - terraform init -backend-config=backend.conf -reconfigure
      - terraform validate
      # -refresh=false keeps the plan role least-privilege (no describe on every
      # resource); the config-vs-state delta is all the cost gate needs.
      - terraform plan -var-file=environments/${ENVIRONMENT}.tfvars -refresh=false -out=plan.tfplan -no-color
      - terraform show -json plan.tfplan > plan.json
      - echo "Plan complete"

artifacts:
  files:
    - terraform/plan.json
    - terraform/plan.tfplan
    - terraform/**/*
    - gates/**/*
    - buildspecs/**/*
    - imagedefinitions.json
    - image_tag.txt
