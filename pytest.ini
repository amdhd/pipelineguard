[pytest]
# Both gate test files are named test_handler.py; importlib mode avoids the
# module-name collision without needing package __init__ files.
addopts = --import-mode=importlib
testpaths =
    gates/cost_gate/tests
    gates/security_gate/tests
    agents/qa/agent/tests
    agents/qa/harness/tests
    agents/fix/tests
